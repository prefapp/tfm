name: OVH PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/ovh-postgresql.yaml"
      - "modules/ovh-postgresql/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ovh-postgresql.yaml"
      - "modules/ovh-postgresql/**"

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.cli.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli:
          - name: Terraform
            command: terraform
            version: 1.12.2
          - name: OpenTofu
            command: tofu
            version: 1.13.9

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        if: matrix.cli.command == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.cli.version }}

      - name: Setup OpenTofu
        if: matrix.cli.command == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.cli.version }}

      - name: Format module
        working-directory: modules/ovh-postgresql
        run: ${{ matrix.cli.command }} fmt -check -recursive

      - name: Initialize and test module
        working-directory: modules/ovh-postgresql
        run: |
          ${{ matrix.cli.command }} init -backend=false
          ${{ matrix.cli.command }} validate
          ${{ matrix.cli.command }} test

      - name: Validate examples
        run: |
          for example in \
            modules/ovh-postgresql/_examples/discovery-private-network \
            modules/ovh-postgresql/_examples/production-pooling; do
            ${{ matrix.cli.command }} -chdir="$example" init -backend=false
            ${{ matrix.cli.command }} -chdir="$example" validate
          done
